name: SimpMC-Notice
version: '2.0.1'
main: cn.simpmc.notice.SimpMCNoticePlugin
api-version: '26.1.2'
folia-supported: true
authors: [Minecraft0122, SimpMC, GPT-5.6]
description: A Plugin For SimpMC Network.

commands:
  noti:
    description: 使用随机前缀广播自定义内容
    usage: /noti <内容>
    permission: simpmc.notice.noti
  notice:
    description: 使用固定前缀库广播自定义内容
    usage: /notice <内容>
    permission: simpmc.notice.notice
  noticereload:
    aliases: [noticrreload]
    description: 重载 SimpMC-Notice 配置、内容库、玩家加入消息和公告时间范围
    usage: /noticereload
    permission: simpmc.notice.reload

permissions:
  simpmc.notice.noti:
    description: 允许使用 /noti
    default: op
  simpmc.notice.notice:
    description: 允许使用 /notice
    default: op
  simpmc.notice.reload:
    description: 允许使用 /noticereload
    default: op
